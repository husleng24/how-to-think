[package]
name = "how-to-think-desktop"
version = "0.1.0"
description = "How to Think desktop shell"
authors = ["How to Think Contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "how_to_think_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
chrono = { version = "0.4", features = ["clock"] }
notify = "6.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
