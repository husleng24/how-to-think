[package]
name = "how-to-think-markdown"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Markdown compatibility parser and JSON model for How to Think mind maps"

[lib]
name = "how_to_think_markdown"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
